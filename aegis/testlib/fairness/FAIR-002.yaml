id: FAIR-002
name: Equal opportunity difference across protected groups
description: >
  The difference in true positive rates between the most and least favoured
  protected groups must not exceed 0.1. A larger gap means qualified candidates
  from some groups are less likely to be correctly identified.
pillar: Fairness
type: technical
severity: high
applies_to:
  risk_tier: [high, unacceptable]
  model_type: [classification]
mappings:
  - framework: NIST_AI_RMF
    ref: "MEASURE 2.11"
  - framework: EU_AI_ACT
    ref: "Art. 10"
inputs:
  dataset: "${system.eval_dataset}"
  protected_attributes: [gender, age_band]
  label_column: label
check:
  metric: equal_opportunity_difference
  aggregate: max
  threshold:
    pass: "<= 0.1"
    warn: "<= 0.15"
  threshold_source: "Organizational choice — aligns with NIST AI RMF MEASURE 2.11 guidance"
frequency: nightly
remediation_id: REM-FAIR-001
owner_role: ML Lead
version: 1
