[project]
name = "aegis"
version = "0.1.0"
description = "AI governance and ethics testing agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "sqlmodel>=0.0.21",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "fairlearn>=0.10",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.38",
    "plotly>=5.24",
    "rich>=13.7",
    "mcp>=1.0",
    "anthropic>=2.8.0",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]
include = [
    "aegis/**/*.py",
    "aegis/**/*.json",
    "aegis/**/*.yaml",
    "aegis/**/*.csv",
    "aegis/**/*.md",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
